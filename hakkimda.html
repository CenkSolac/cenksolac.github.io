<body>
<header class="ust">
  <a class="marka" href="/">CenkSolac</a>
  <nav><a href="novel">Novel</a><a href="canliyayin">Canlı yayın</a><a href="mobpazari">Mob Pazarı</a><a href="gunluk">Günlük</a></nav>
</header>
<main id="app"><p class="bos">Yükleniyor...</p><noscript><p class="bos">Bu sayfanın çalışması için tarayıcında JavaScript açık olmalı.</p></noscript></main>
<script>
const app=document.getElementById("app");
function e(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}
fetch("veri/hakkimda.json").then(r=>r.json()).then(d=>{
  const baslik=String(d.baslik||"").trim()||"Hakkımda",giris=String(d.giris||"").trim(),metin=String(d.metin||"").trim();
  document.title=baslik+" | CenkSolac";
  app.replaceChildren(e("h1",null,baslik));
  if(giris)app.append(e("p","hakkimda-giris",giris));
  const govde=e("div","hakkimda-govde");
  metin.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(p=>govde.append(e("p",null,p)));
  if(govde.children.length)app.append(govde);
  const dugmeler=e("div","dugmeler");
  [["Mob Pazarı","mobpazari",true],["Klipler","canliyayin",false],["Günlük","gunluk",false]].forEach(([ad,url,ana])=>{
    const a=e("a","btn"+(ana?" ana":""),ad);a.href=url;dugmeler.append(a);
  });
  app.append(dugmeler);
}).catch(()=>{app.replaceChildren(e("p","bos","Sayfa yüklenemedi. Yenile, olmazsa biraz sonra tekrar dene."))});
</script>
