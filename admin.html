<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönetim paneli</title>
<link href="admin-config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
<a id="bildirim-kisayol" href="/gonder" target="_blank" rel="noopener" hidden>🔔 Bildirim gönder</a>
<style>#bildirim-kisayol{position:fixed;right:14px;bottom:14px;z-index:5;font:600 14px system-ui,sans-serif;color:#0b1020;background:#7cc4ff;border-radius:999px;padding:9px 14px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}#bildirim-kisayol[hidden]{display:none}</style>
<script>
// Panelden bildirim gönderme sayfasına kısayol (bildirim kapalıysa görünmez)
fetch("/veri/bildirim.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(a){if(a&&a.aktif)document.getElementById("bildirim-kisayol").hidden=false}).catch(function(){});
</script>
<script src="https://unpkg.com/@sveltia/cms@0.229.0/dist/sveltia-cms.js"></script>
</body>
</html>
