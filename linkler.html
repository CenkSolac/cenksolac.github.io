<body>
<main class="linkler">
  <img class="linkler-resim" src="/favicon.png" alt="" width="96" height="96">
  <h1>CenkSolac</h1>
  <p class="alt">Canlı yayıncı · Mob Pazarı · Klipler · Novel</p>
  <nav class="linkler-liste" aria-label="Site bağlantıları">
    <a class="link-dugme ana" href="/mobpazari"><strong>Mob Pazarı</strong><span>Yayına mob göndermek için buradan seç</span></a>
    <a class="link-dugme" href="/canliyayin"><strong>Klipler ve yayın</strong><span>Sıradaki yayın, komik anlar, takipçi editleri</span></a>
    <a class="link-dugme" href="/novel"><strong>Novel</strong><span>Serileri oku</span></a>
    <a class="link-dugme" href="/gunluk"><strong>Günlük</strong><span>Yayın takvimi ve günlük yazılarım</span></a>
    <a class="link-dugme" href="/hakkimda"><strong>Hakkımda</strong><span>Ben kimim?</span></a>
  </nav>
  <h2 class="linkler-baslik">Hesaplarım</h2>
  <div class="linkler-liste" id="hesaplar"></div>
</main>
<script>
fetch("/veri/sosyal.json").then(r=>r.json()).then(d=>{
  const kutu=document.getElementById("hesaplar");
  (d.baglantilar||[]).filter(x=>x&&x.ad&&/^https?:\/\//i.test(String(x.url||"").trim())).forEach(x=>{
    const a=document.createElement("a");a.className="link-dugme";a.href=x.url.trim();a.target="_blank";a.rel="me noopener noreferrer";
    const s=document.createElement("strong");s.textContent=x.ad;a.append(s);kutu.append(a);
  });
  if(!kutu.children.length)kutu.previousElementSibling.hidden=true;
}).catch(()=>{});
</script>
<script src="/uygulama.js" defer></script>
