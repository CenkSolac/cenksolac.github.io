# GitHub Pages (Jekyll) ayarı. Novel bölümlerinin, günlük yazılarının ve kliplerin listesini otomatik üretir.
# Bu dosyayı değiştirmene gerek yok.
collections:
  bolumler:
    output: true
  yazilar:
    output: true
  klipler:
    output: false
defaults:
  - scope:
      path: ""
      type: "bolumler"
    values:
      layout: "bolum"
  - scope:
      path: ""
      type: "yazilar"
    values:
      layout: "bolum"
