<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bildirim gönder</title>
<style>body{margin:0;background:#0b1020;color:#e8ecf8;font:16px/1.5 system-ui,sans-serif;padding:24px}a{color:#7cc4ff}</style>
</head>
<body>
<p id="m">Bildirim gönderme sayfasına gidiyorsun...</p>
<script>
// Kısayol: cenksolac.com/gonder -> bildirim sunucusunun gönderme sayfası (şifre orada sorulur)
fetch("/veri/bildirim.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(a){
  var u=new URL(String(a.api)).origin+"/yonetim";
  document.getElementById("m").innerHTML="";
  var l=document.createElement("a");l.href=u;l.textContent="Bildirim gönderme sayfasına git";
  document.getElementById("m").append(l);
  location.replace(u);
}).catch(function(){document.getElementById("m").textContent="Adres okunamadı. Sayfayı yenile."});
</script>
</body>
</html>
