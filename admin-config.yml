backend:
  name: github
  repo: CenkSolac/cenksolac.github.io
  branch: main
  commit_messages:
    update: "Panelden güncelleme: {{collection}}"
    uploadMedia: "Panelden resim yüklendi: {{path}}"
    create: "Panelden yeni kayıt: {{collection}} / {{slug}}"
    delete: "Panelden silindi: {{collection}} / {{slug}}"
# Metinleri tırnak içinde kaydeder. Saat gibi değerlerin yanlış okunmasını önler.
yaml_quote: true
site_url: https://cenksolac.com
display_url: https://cenksolac.com
locale: tr

# Mob resimlerinin klasörü. Hediye alanlarında ayrıca /hediyeler seçilir.
media_folder: /mobs
public_folder: /mobs

# Yüklenen her resim otomatik WebP olur ve en fazla 600x600 piksele küçülür.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 600
        height: 600

collections:
  # ---------------------------------------------------------------- CANLI YAYIN
  - name: canli
    label: Canlı yayın
    icon: sensors
    files:
      - name: rakamlar
        label: Canlı yayın rakamları
        file: veri/canli.json
        format: json
        fields:
          - {label: Son güncelleme, name: guncelleme, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, required: false, default: "{{now}}", hint: "Rakamları en son ne zaman güncelledin?"}
          - {label: Toplam ödül, name: toplamOdul, widget: number, value_type: int, required: false}
          - {label: Beğeni, name: begeni, widget: number, value_type: int, required: false}
          - {label: Yorum, name: yorum, widget: number, value_type: int, required: false}
          - label: Sponsorlar
            name: sponsorlar
            widget: list
            required: false
            label_singular: sponsor
            summary: "{{fields.ad}}: {{fields.deger}}"
            fields:
              - {label: Sponsor adı, name: ad, widget: string}
              - {label: Katkı, name: deger, widget: number, value_type: int}
          - label: Coin atanlar
            name: coinAtanlar
            widget: list
            required: false
            label_singular: izleyici
            collapsed: true
            max: 100
            summary: "{{fields.ad}}: {{fields.deger}}"
            hint: "En fazla 100 kişi. Sırayı kendisi büyükten küçüğe dizer, karışık girebilirsin. Sitede ilk 10 kişi görünür, gerisi 'Daha fazla göster' ile açılır."
            fields:
              - {label: İzleyici adı, name: ad, widget: string}
              - {label: Coin, name: deger, widget: number, value_type: int}
          - label: Beğeni atanlar
            name: begeniAtanlar
            widget: list
            required: false
            label_singular: izleyici
            collapsed: true
            max: 100
            summary: "{{fields.ad}}: {{fields.deger}}"
            hint: "En fazla 100 kişi. Sırayı kendisi büyükten küçüğe dizer, karışık girebilirsin. Sitede ilk 10 kişi görünür, gerisi 'Daha fazla göster' ile açılır."
            fields:
              - {label: İzleyici adı, name: ad, widget: string}
              - {label: Beğeni, name: deger, widget: number, value_type: int}
          - label: Sıralama
            name: siralama
            widget: list
            required: false
            label_singular: izleyici
            summary: "{{fields.ad}}: {{fields.deger}}"
            fields:
              - {label: İzleyici adı, name: ad, widget: string}
              - {label: Puan, name: deger, widget: number, value_type: int}

  # ---------------------------------------------------------------- MOB PAZARI
  - name: moblar
    label: Mob Pazarı
    icon: storefront
    files:
      - name: liste
        label: Mob listesi
        file: veri/moblar.json
        format: json
        fields:
          - label: Survival mobları
            name: survival
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}
          - label: OneBlock mobları
            name: oneblock
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}
          - label: Castle mobları
            name: castle
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}

  # ---------------------------------------------------------------- NOVEL SERİLERİ
  - name: novel
    label: Novel serileri
    icon: menu_book
    files:
      - name: seriler
        label: Novel serileri
        file: veri/seriler.json
        format: json
        fields:
          - label: Seriler
            name: seriler
            widget: list
            label_singular: seri
            summary: "{{fields.ad}}"
            fields:
              - {label: Seri kodu, name: id, widget: string, hint: "Küçük harf, boşluksuz, Türkçe harf yok. Örnek: fleshbeyondhumanity. Kaydettikten sonra değiştirme."}
              - {label: Seri adı, name: ad, widget: string}
              - {label: Kapak görseli, name: kapak, widget: image, required: false, media_folder: /kapaklar, public_folder: /kapaklar, hint: "Dikey bir kapak resmi yükle (2:3 oran güzel durur). Kendisi küçültüp WebP yapar."}
              - label: Dil
                name: dil
                widget: select
                options: [{label: Türkçe, value: tr}, {label: English, value: en}]
              - {label: Özet, name: ozet, widget: text, hint: "Seriye tıklayınca en üstte görünen tanıtım yazısı."}

  # ---------------------------------------------------------------- NOVEL BÖLÜMLERİ
  - name: bolumler
    label: Novel bölümleri
    label_singular: bölüm
    icon: article
    folder: _bolumler
    path: "{{seri}}/{{numara}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{seri}} · Bölüm {{numara}}: {{baslik}}"
    sortable_fields:
      fields: [numara, seri, baslik]
      default:
        field: numara
        direction: descending
    fields:
      - label: Seri
        name: seri
        widget: relation
        collection: novel
        file: seriler
        value_field: "{{seriler.*.id}}"
        display_fields: ["{{seriler.*.ad}}"]
        search_fields: ["{{seriler.*.ad}}"]
        hint: "Hangi serinin bölümü? Liste, Novel serileri bölümünden gelir."
      - {label: Bölüm numarası, name: numara, widget: number, value_type: int, min: 1, hint: "1, 2, 3 diye devam et. Aynı seride aynı numarayı iki kez kullanma. Kaydettikten sonra değiştirme."}
      - {label: Bölüm başlığı, name: baslik, widget: string, hint: "Sitede böyle görünür. Örnek: Bölüm 5: Yeni Başlangıç"}
      - {label: Bölüm metni, name: metin, widget: text, hint: "Yeni paragraf için araya boş bir satır bırak."}

  # ---------------------------------------------------------------- GÜNLÜK
  - name: gunluk
    label: Günlük
    label_singular: yazı
    icon: edit_note
    folder: _yazilar
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: baslik
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: /gunluk-resimleri
    public_folder: /gunluk-resimleri
    summary: "{{tarih}} · {{baslik}}"
    description: "Her günlük yazısı ayrı bir kayıt. Üstteki 'Yeni yazı' düğmesiyle yaz, listeden tıklayıp düzenle."
    sortable_fields:
      fields: [tarih, baslik]
      default:
        field: tarih
        direction: descending
    fields:
      - {label: Başlık, name: baslik, widget: string, hint: "Yazının adı. Sitede liste ve okuma sayfasında görünür."}
      - {label: Hangi güne ait, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "Takvimde bu günün altında görünür."}
      - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false, hint: "İstersen boş bırak."}
      - label: Ruh halim
        name: ruh
        widget: select
        required: false
        hint: "İstersen seç. Yazının yanında küçük bir ikon olarak görünür."
        options:
          - {label: "😄 Harika", value: harika}
          - {label: "🙂 İyi", value: iyi}
          - {label: "😐 Normal", value: normal}
          - {label: "😴 Yorgun", value: yorgun}
          - {label: "😔 Üzgün", value: uzgun}
          - {label: "😡 Sinirli", value: sinirli}
          - {label: "🤩 Heyecanlı", value: heyecanli}
      - label: Etiketler
        name: etiketler
        widget: list
        required: false
        label_singular: etiket
        field: {label: Etiket, name: etiket, widget: string}
        hint: "İstersen ekle. Örnek: yayın, minecraft, novel. Ziyaretçiler etikete göre filtreleyebilir."
      - {label: Kapak fotoğrafı, name: kapak, widget: image, required: false, hint: "İstersen bir fotoğraf ekle. Kendisi küçültüp WebP yapar."}
      - label: Yazı
        name: metin
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
        hint: "Normal yaz. Yeni paragraf için araya boş satır bırak. Üstteki düğmelerle kalın, italik, başlık, liste, alıntı ve bağlantı ekleyebilirsin."
      - {label: Sitede yayınla, name: published, widget: boolean, default: true, hint: "Kapatırsan yazı taslak olarak kalır, sitede hiç görünmez. Hazır olunca aç."}

  # ---------------------------------------------------------------- TAKVİM
  - name: takvim
    label: Takvim
    icon: calendar_month
    files:
      - name: etkinlikler
        label: Takvim etkinlikleri
        file: veri/takvim.json
        format: json
        fields:
          - label: Etkinlikler
            name: takvim
            widget: list
            label_singular: etkinlik
            add_to_top: true
            summary: "{{fields.tarih}} {{fields.saat}} {{fields.baslik}}"
            fields:
              - {label: Tarih, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}"}
              - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false}
              - label: Tür
                name: tur
                widget: select
                default: yayin
                options: [{label: Canlı yayın, value: yayin}, {label: YouTube videosu, value: video}, {label: Diğer, value: diger}]
              - {label: Başlık, name: baslik, widget: string}
              - {label: Not, name: not, widget: text, required: false, hint: "İstersen kısa bir açıklama."}

  # ---------------------------------------------------------------- SOSYAL MEDYA
  - name: sosyal
    label: Sosyal medya
    icon: share
    files:
      - name: baglantilar
        label: Sosyal medya bağlantıları
        file: veri/sosyal.json
        format: json
        fields:
          - label: Hesaplar
            name: baglantilar
            widget: list
            label_singular: hesap
            summary: "{{fields.ad}}"
            hint: "Sırası sitedeki sırasıdır. İlk sıraya en önemli hesabı koy."
            fields:
              - {label: Hesap adı, name: ad, widget: string, hint: "Sitede görünen yazı. Örnek: TikTok"}
              - {label: Bağlantı, name: url, widget: string, pattern: ["^https?://.+", "Bağlantı https:// ile başlamalı"], hint: "Hesabın tam adresi. Örnek: https://www.tiktok.com/@cenksolac"}
