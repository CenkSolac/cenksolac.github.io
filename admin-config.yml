backend:
  name: github
  repo: CenkSolac/cenksolac.github.io
  branch: main
  commit_messages:
    update: "Panelden güncelleme: {{collection}}"
    uploadMedia: "Panelden resim yüklendi: {{path}}"
    create: "Panelden yeni kayıt: {{collection}} / {{slug}}"
    delete: "Panelden silindi: {{collection}} / {{slug}}"
# Metinleri tırnak içinde kaydeder. Saat gibi değerlerin yanlış okunmasını önler.
yaml_quote: true
site_url: https://cenksolac.com
display_url: https://cenksolac.com
locale: tr

# Dosya ve adres adları Türkçe harf içermesin (ş→s, ğ→g gibi).
slug:
  encoding: ascii
  clean_accents: true

# Mob resimlerinin klasörü. Hediye alanlarında ayrıca /hediyeler seçilir.
media_folder: /mobs
public_folder: /mobs

# Yüklenen her resim otomatik WebP olur ve en fazla 600x600 piksele küçülür.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 600
        height: 600

collections:
  # ---------------------------------------------------------------- KLİPLER (Canlı yayın sayfası)
  - name: klipler
    label: Klipler
    label_singular: klip
    icon: movie
    folder: _klipler
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: baslik
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{tarih}} · {{baslik}}"
    description: "Canlı yayın sayfasında görünen klipler. 'Yeni klip' ile ekle, listeden tıklayıp düzenle."
    sortable_fields:
      fields: [tarih, baslik]
      default:
        field: tarih
        direction: descending
    fields:
      - {label: Başlık, name: baslik, widget: string, hint: "Klibin adı. Örnek: Dev Çukur'a düştüm"}
      - {label: Tarih, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "Klibin yayınlandığı ya da çekildiği gün. Yeni klipler önde görünür."}
      - {label: Video linki, name: link, widget: string, required: false, pattern: ["^https?://.+", "Link https:// ile başlamalı"], hint: "YouTube veya TikTok linkini yapıştır. TikTok için tam link lazım: tiktok.com/@kullanici/video/rakamlar. Dosya yükleyeceksen burayı boş bırak."}
      - {label: Ya da video dosyası, name: video, widget: file, required: false, media_folder: /klipler/video, public_folder: /klipler/video, hint: "Bilgisayarından ya da telefonundan video yükle. Dosya 25 MB'ı geçmesin: 1080p ve 1 dakikaya kadar olur. Büyükse önce küçült ya da YouTube'a yükleyip linkini yapıştır."}
      - label: Ekran şekli
        name: yon
        widget: select
        required: false
        options: [{label: Yatay (bilgisayar gibi), value: yatay}, {label: Dikey (telefon, TikTok gibi), value: dikey}]
        hint: "Boş bırakırsan site tahmin eder: TikTok ve YouTube Shorts dikey, diğerleri yatay."
      - {label: Kapak resmi, name: kapak, widget: image, required: false, media_folder: /klipler/kapak, public_folder: /klipler/kapak, hint: "İstersen ekle. YouTube klibinde boş bırakabilirsin, kendisi alır. Dosya ve TikTok için eklemek iyi durur."}
      - label: Türü
        name: etiketler
        widget: select
        multiple: true
        required: false
        options: ["Komik", "Edit", "Yayın anı", "Takipçi edit", "Mob Pazarı"]
        hint: "Birden fazla seçebilirsin. Ziyaretçiler buna göre filtreler. Başka tür lazımsa bana söyle."
      - {label: Klibi yapan, name: editor, widget: string, required: false, hint: "Edit'i yapan takipçinin adı. Sitede kredi olarak görünür. Boş bırakırsan görünmez."}
      - {label: Klibi yapanın profili, name: editor_link, widget: string, required: false, pattern: ["^https?://.+", "Link https:// ile başlamalı"], hint: "Örnek: https://www.tiktok.com/@kullanici. Adına tıklayınca buraya gider."}
      - {label: Hangi mobla ilgili, name: mob, widget: string, required: false, hint: "Mob Pazarı'ndaki mobun adını aynen yaz (örnek: Dev Çukur). O mobun kartında 'Klibi izle' düğmesi çıkar."}
      - {label: Kısa açıklama, name: aciklama, widget: text, required: false, hint: "İstersen birkaç cümle yaz. Klibi açınca altında görünür."}
      - {label: Öne çıkan klip, name: onecikan, widget: boolean, default: false, hint: "Açarsan klip sayfanın en üstünde ve ana sayfada büyük görünür. Birden fazlasında açıksa en yenisi görünür."}
      - {label: Sitede yayınla, name: published, widget: boolean, default: true, hint: "Kapatırsan klip taslak olarak kalır, sitede görünmez."}

  # ---------------------------------------------------------------- MOB PAZARI
  - name: moblar
    label: Mob Pazarı
    icon: storefront
    files:
      - name: liste
        label: Mob listesi
        file: veri/moblar.json
        format: json
        fields:
          - label: Survival mobları
            name: survival
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}
              - label: Tehlike seviyesi
                name: tehlike
                widget: select
                required: false
                options: [Zararsız, Düşük, Orta, Yüksek, Ölümcül]
                hint: "Mobun oyuncuya ne kadar zarar verdiği. Sitede rozet olarak görünür ve ziyaretçi buna göre filtreler. Boş bırakırsan rozet görünmez."
              - {label: Özel event mobu, name: ozel_event, widget: boolean, default: false, required: false, hint: "Sadece özel event sırasında gönderilen mobsa aç. Ziyaretçi 'Özel event' filtresiyle bunları ayırabilir."}
              - {label: Eklenme tarihi, name: eklenme, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", required: false, hint: "Yeni mob eklerken bugünün tarihi kendiliğinden gelir. Bu günden sonraki 14 gün boyunca mobun üstünde 'Yeni' rozeti görünür. Eski mobları boş bırak."}
          - label: OneBlock mobları
            name: oneblock
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}
              - label: Tehlike seviyesi
                name: tehlike
                widget: select
                required: false
                options: [Zararsız, Düşük, Orta, Yüksek, Ölümcül]
                hint: "Mobun oyuncuya ne kadar zarar verdiği. Sitede rozet olarak görünür ve ziyaretçi buna göre filtreler. Boş bırakırsan rozet görünmez."
              - {label: Özel event mobu, name: ozel_event, widget: boolean, default: false, required: false, hint: "Sadece özel event sırasında gönderilen mobsa aç. Ziyaretçi 'Özel event' filtresiyle bunları ayırabilir."}
              - {label: Eklenme tarihi, name: eklenme, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", required: false, hint: "Yeni mob eklerken bugünün tarihi kendiliğinden gelir. Bu günden sonraki 14 gün boyunca mobun üstünde 'Yeni' rozeti görünür. Eski mobları boş bırak."}
          - label: Castle mobları
            name: castle
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
              - {label: Açıklama, name: aciklama, widget: text, required: false, hint: "Bu mobun ve hediyenin ne işe yaradığını yaz. Yeni satır için Enter'a bas. Boş bırakırsan sitede açıklama görünmez."}
              - label: Tehlike seviyesi
                name: tehlike
                widget: select
                required: false
                options: [Zararsız, Düşük, Orta, Yüksek, Ölümcül]
                hint: "Mobun oyuncuya ne kadar zarar verdiği. Sitede rozet olarak görünür ve ziyaretçi buna göre filtreler. Boş bırakırsan rozet görünmez."
              - {label: Özel event mobu, name: ozel_event, widget: boolean, default: false, required: false, hint: "Sadece özel event sırasında gönderilen mobsa aç. Ziyaretçi 'Özel event' filtresiyle bunları ayırabilir."}
              - {label: Eklenme tarihi, name: eklenme, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", required: false, hint: "Yeni mob eklerken bugünün tarihi kendiliğinden gelir. Bu günden sonraki 14 gün boyunca mobun üstünde 'Yeni' rozeti görünür. Eski mobları boş bırak."}

  # ---------------------------------------------------------------- NOVEL SERİLERİ
  - name: seriler
    label: Novel serileri
    label_singular: seri
    icon: menu_book
    folder: _seriler
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: ad
    slug: "{{slug}}"
    media_folder: /kapaklar
    public_folder: /kapaklar
    summary: "{{ad}}"
    description: "Her novel serisi ayrı bir kayıt. 'Yeni seri' ile ekle. Seri kodu adından kendiliğinden oluşur, sen bir şey yazmazsın."
    sortable_fields:
      fields: [sira, ad]
      default:
        field: sira
        direction: ascending
    fields:
      - {label: Seri adı, name: ad, widget: string, hint: "Sitede görünen ad. Kaydettikten sonra adı değiştirebilirsin, bölümler seriden kopmaz."}
      - {label: Kapak görseli, name: kapak, widget: image, required: false, hint: "Dikey bir kapak resmi yükle (2:3 oran güzel durur). Kendisi küçültüp WebP yapar."}
      - label: Dil
        name: dil
        widget: select
        options: [{label: Türkçe, value: tr}, {label: English, value: en}]
      - label: Durum
        name: durum
        widget: select
        required: false
        options: [Devam ediyor, Tamamlandı, Ara verildi]
        hint: "Seri hangi aşamada? Sitede rozet olarak görünür, ziyaretçi buna göre filtreleyebilir."
      - {label: Yazar, name: yazar, widget: string, required: false, hint: "İstersen yaz. Seri sayfasında 'Yazar: ...' diye görünür."}
      - label: Türler
        name: turler
        widget: select
        multiple: true
        required: false
        options: [Fantastik, Aksiyon, Macera, Romantik, Gizem, Korku, Bilim kurgu, Komedi, Drama, Sistem, Reenkarnasyon, Hayatta kalma, Karanlık, Savaş, Okul, Günlük yaşam]
        hint: "İstediklerini seç. Sitede küçük etiketler olarak görünür. Listede olmayan bir tür lazımsa söyle, eklerim."
      - {label: Sıra, name: sira, widget: number, value_type: int, required: false, default: 1, hint: "Sitedeki sıra. 1 en üstte görünür, 2 onun altında."}
      - {label: Özet, name: ozet, widget: text, hint: "Seriye tıklayınca en üstte görünen tanıtım yazısı. Paragraflar arasında boş satır bırak."}
      - {label: Sitede yayınla, name: published, widget: boolean, default: true, hint: "Kapatırsan seri sitede görünmez. Hazır olunca aç."}

  # ---------------------------------------------------------------- NOVEL BÖLÜMLERİ
  - name: bolumler
    label: Novel bölümleri
    label_singular: bölüm
    icon: article
    folder: _bolumler
    path: "{{seri}}/{{numara}}"
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{seri}} · Bölüm {{numara}}: {{baslik}}"
    description: "Her bölüm ayrı bir kayıt. Önce 'Yeni bölüm'e bas, seriyi seç, numarayı yaz. Listeyi seriye göre gruplayabilirsin. Taslak bölümler sitede görünmez."
    sortable_fields:
      fields: [numara, seri, baslik, tarih]
      default:
        field: numara
        direction: descending
    view_groups:
      - {label: Seriye göre, field: seri}
    view_filters:
      - {label: Taslaklar, field: published, pattern: false}
    fields:
      - label: Seri
        name: seri
        widget: relation
        collection: seriler
        value_field: "{{slug}}"
        search_fields: [ad]
        display_fields: [ad]
        hint: "Hangi serinin bölümü? Liste, Novel serileri bölümünden gelir. Yeni seriyi önce orada ekle."
      - {label: Bölüm numarası, name: numara, widget: number, value_type: int, min: 1, hint: "Serideki son bölümün numarasından bir fazlasını yaz. Aynı seride aynı numarayı iki kere kullanma, bölümler birbirine karışır. Kaydettikten sonra değiştirme."}
      - {label: Bölüm başlığı, name: baslik, widget: string, hint: "Sitede böyle görünür. Örnek: Bölüm 5: Yeni Başlangıç"}
      - {label: Yayın günü, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", required: false, hint: "Bölüm bu günden itibaren sitede görünür. İleri bir gün seçersen o güne kadar saklı kalır. Son 14 gün içindeki bölümler 'Yeni' rozeti alır. Eski bölümlerde boş kalabilir."}
      - label: Bölüm metni
        name: metin
        widget: markdown
        buttons: [bold, italic, heading-two, quote]
        editor_components: []
        hint: "Normal yaz, yapıştırabilirsin. Yeni paragraf için araya boş satır bırak. Sahne değişimi için boş bir satıra --- yaz. Üstteki düğmelerle kalın, italik, başlık ve alıntı yapabilirsin."
      - {label: Sitede yayınla, name: published, widget: boolean, default: true, hint: "Kapatırsan bölüm taslak olarak kalır ve sitede hiç görünmez. Yarım kalan bölümler için kapat, hazır olunca aç."}

  # ---------------------------------------------------------------- GÜNLÜK
  - name: gunluk
    label: Günlük
    label_singular: yazı
    icon: edit_note
    folder: _yazilar
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: baslik
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: /gunluk-resimleri
    public_folder: /gunluk-resimleri
    summary: "{{tarih}} · {{baslik}}"
    description: "Her günlük yazısı ayrı bir kayıt. Üstteki 'Yeni yazı' düğmesiyle yaz, listeden tıklayıp düzenle."
    sortable_fields:
      fields: [tarih, baslik]
      default:
        field: tarih
        direction: descending
    fields:
      - {label: Başlık, name: baslik, widget: string, hint: "Yazının adı. Sitede liste ve okuma sayfasında görünür."}
      - {label: Hangi güne ait, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "Takvimde bu günün altında görünür."}
      - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false, hint: "İstersen boş bırak."}
      - label: Ruh halim
        name: ruh
        widget: select
        required: false
        hint: "İstersen seç. Yazının yanında küçük bir ikon olarak görünür."
        options:
          - {label: "😄 Harika", value: harika}
          - {label: "🙂 İyi", value: iyi}
          - {label: "😐 Normal", value: normal}
          - {label: "😴 Yorgun", value: yorgun}
          - {label: "😔 Üzgün", value: uzgun}
          - {label: "😡 Sinirli", value: sinirli}
          - {label: "🤩 Heyecanlı", value: heyecanli}
      - label: Etiketler
        name: etiketler
        widget: list
        required: false
        label_singular: etiket
        field: {label: Etiket, name: etiket, widget: string}
        hint: "İstersen ekle. Örnek: yayın, minecraft, novel. Ziyaretçiler etikete göre filtreleyebilir."
      - {label: Kapak fotoğrafı, name: kapak, widget: image, required: false, hint: "İstersen bir fotoğraf ekle. Kendisi küçültüp WebP yapar."}
      - label: Yazı
        name: metin
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
        hint: "Normal yaz. Yeni paragraf için araya boş satır bırak. Üstteki düğmelerle kalın, italik, başlık, liste, alıntı ve bağlantı ekleyebilirsin."
      - {label: Sitede yayınla, name: published, widget: boolean, default: true, hint: "Kapatırsan yazı taslak olarak kalır, sitede hiç görünmez. Hazır olunca aç."}

  # ---------------------------------------------------------------- TAKVİM
  - name: takvim
    label: Takvim
    icon: calendar_month
    files:
      - name: etkinlikler
        label: Takvim etkinlikleri
        file: veri/takvim.json
        format: json
        fields:
          - label: Etkinlikler
            name: takvim
            widget: list
            label_singular: etkinlik
            add_to_top: true
            summary: "{{fields.tarih}} {{fields.saat}} {{fields.baslik}}"
            fields:
              - {label: Tarih, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}"}
              - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false}
              - label: Tür
                name: tur
                widget: select
                default: yayin
                options: [{label: Canlı yayın, value: yayin}, {label: YouTube videosu, value: video}, {label: Diğer, value: diger}]
              - {label: Başlık, name: baslik, widget: string}
              - {label: Not, name: not, widget: text, required: false, hint: "İstersen kısa bir açıklama."}

  # ---------------------------------------------------------------- SOSYAL MEDYA
  - name: sosyal
    label: Sosyal medya
    icon: share
    files:
      - name: baglantilar
        label: Sosyal medya bağlantıları
        file: veri/sosyal.json
        format: json
        fields:
          - label: Hesaplar
            name: baglantilar
            widget: list
            label_singular: hesap
            summary: "{{fields.ad}}"
            hint: "Sırası sitedeki sırasıdır. İlk sıraya en önemli hesabı koy."
            fields:
              - {label: Hesap adı, name: ad, widget: string, hint: "Sitede görünen yazı. Örnek: TikTok"}
              - {label: Bağlantı, name: url, widget: string, pattern: ["^https?://.+", "Bağlantı https:// ile başlamalı"], hint: "Hesabın tam adresi. Örnek: https://www.tiktok.com/@cenksolac"}

  # ---------------------------------------------------------------- DUYURU ÇUBUĞU
  - name: duyuru
    label: Duyuru çubuğu
    icon: campaign
    files:
      - name: duyuru
        label: Sitenin üstündeki duyuru
        file: veri/duyuru.json
        format: json
        fields:
          - {label: Duyuru görünsün mü, name: aktif, widget: boolean, default: false, hint: "Kapalıysa sitede hiçbir şey görünmez."}
          - {label: Duyuru yazısı, name: metin, widget: string, required: false, hint: "Kısa tut, tek satıra sığsın. Örnek: Bu akşam 20:00'de yayındayım!"}
          - {label: Bağlantı, name: link, widget: string, required: false, pattern: ["^(https?://|/)[^/ ].*|^/$", "Bağlantı / ya da https:// ile başlamalı"], hint: "İstersen duyuruya tıklanacak yer. Sitenin içi için /canliyayin gibi yaz, dış site için tam adres yaz."}
          - {label: Düğme yazısı, name: link_yazi, widget: string, required: false, hint: "Bağlantının yanında görünen yazı. Boş bırakırsan 'Bak' yazar."}
          - {label: Bitiş günü, name: bitis, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "İstersen seç. O günün sonunda duyuru kendiliğinden kalkar."}

  # ---------------------------------------------------------------- HAKKIMDA
  - name: hakkimda
    label: Hakkımda
    icon: person
    files:
      - name: hakkimda
        label: Hakkımda sayfası
        file: veri/hakkimda.json
        format: json
        fields:
          - {label: Sayfa başlığı, name: baslik, widget: string}
          - {label: Kısa tanıtım, name: giris, widget: text, required: false, hint: "Başlığın altında büyükçe görünen bir iki cümle."}
          - {label: Yazı, name: metin, widget: text, hint: "Paragraflar arasında boş satır bırak (Enter'a iki kere bas)."}
