backend:
  name: github
  repo: CenkSolac/cenksolac.github.io
  branch: main
  commit_messages:
    update: "Panelden güncelleme: {{collection}}"
    uploadMedia: "Panelden resim yüklendi: {{path}}"
site_url: https://cenksolac.com
display_url: https://cenksolac.com
locale: tr

# Mob resimlerinin klasörü. Hediye alanlarında ayrıca /hediyeler seçilir.
media_folder: /mobs
public_folder: /mobs

# Yüklenen her resim otomatik WebP olur ve en fazla 600x600 piksele küçülür.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 600
        height: 600

collections:
  # ---------------------------------------------------------------- CANLI YAYIN
  - name: canli
    label: Canlı yayın
    icon: sensors
    files:
      - name: rakamlar
        label: Canlı yayın rakamları
        file: veri/canli.json
        format: json
        fields:
          - {label: Son güncelleme, name: guncelleme, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, required: false, default: "{{now}}", hint: "Rakamları en son ne zaman güncelledin?"}
          - {label: Toplam ödül, name: toplamOdul, widget: number, value_type: int, required: false}
          - {label: Beğeni, name: begeni, widget: number, value_type: int, required: false}
          - {label: Yorum, name: yorum, widget: number, value_type: int, required: false}
          - label: Sponsorlar
            name: sponsorlar
            widget: list
            required: false
            label_singular: sponsor
            summary: "{{fields.ad}}: {{fields.deger}}"
            fields:
              - {label: Sponsor adı, name: ad, widget: string}
              - {label: Katkı, name: deger, widget: number, value_type: int}
          - label: Sıralama
            name: siralama
            widget: list
            required: false
            label_singular: izleyici
            summary: "{{fields.ad}}: {{fields.deger}}"
            fields:
              - {label: İzleyici adı, name: ad, widget: string}
              - {label: Puan, name: deger, widget: number, value_type: int}

  # ---------------------------------------------------------------- MOB PAZARI
  - name: moblar
    label: Mob Pazarı
    icon: storefront
    files:
      - name: liste
        label: Mob listesi
        file: veri/moblar.json
        format: json
        fields:
          - label: Survival mobları
            name: survival
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
          - label: OneBlock mobları
            name: oneblock
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}
          - label: Castle mobları
            name: castle
            widget: list
            required: false
            label_singular: mob
            collapsed: true
            summary: "{{fields.ad}} ({{fields.coin}} coin)"
            fields:
              - {label: Mob adı, name: ad, widget: string}
              - {label: Mob resmi, name: gorsel, widget: image, media_folder: /mobs, public_folder: /mobs, hint: "Resmi buraya yükle. Kendisi küçültüp WebP'ye çevirir."}
              - {label: Hediye adı, name: hediye, widget: string}
              - {label: Hediye resmi, name: hediyeGorsel, widget: image, required: false, media_folder: /hediyeler, public_folder: /hediyeler, hint: "İstersen yükle, istemezsen boş bırak."}
              - {label: Coin, name: coin, widget: number, value_type: int, hint: "Hediyenin coin değeri"}

  # ---------------------------------------------------------------- NOVEL SERİLERİ
  - name: novel
    label: Novel serileri
    icon: menu_book
    files:
      - name: seriler
        label: Novel serileri
        file: veri/seriler.json
        format: json
        fields:
          - label: Seriler
            name: seriler
            widget: list
            label_singular: seri
            summary: "{{fields.ad}}"
            fields:
              - {label: Seri kodu, name: id, widget: string, hint: "Küçük harf, boşluksuz, Türkçe harf yok. Örnek: fleshbeyondhumanity. Kaydettikten sonra değiştirme."}
              - {label: Seri adı, name: ad, widget: string}
              - {label: Kapak görseli, name: kapak, widget: image, required: false, media_folder: /kapaklar, public_folder: /kapaklar, hint: "Dikey bir kapak resmi yükle (2:3 oran güzel durur). Kendisi küçültüp WebP yapar."}
              - label: Dil
                name: dil
                widget: select
                options: [{label: Türkçe, value: tr}, {label: English, value: en}]
              - {label: Özet, name: ozet, widget: text, hint: "Seriye tıklayınca en üstte görünen tanıtım yazısı."}

  # ---------------------------------------------------------------- NOVEL BÖLÜMLERİ
  - name: bolumler
    label: Novel bölümleri
    label_singular: bölüm
    icon: article
    folder: _bolumler
    path: "{{seri}}/{{numara}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{seri}} · Bölüm {{numara}}: {{baslik}}"
    sortable_fields:
      fields: [numara, seri, baslik]
      default:
        field: numara
        direction: descending
    fields:
      - label: Seri
        name: seri
        widget: relation
        collection: novel
        file: seriler
        value_field: "{{seriler.*.id}}"
        display_fields: ["{{seriler.*.ad}}"]
        search_fields: ["{{seriler.*.ad}}"]
        hint: "Hangi serinin bölümü? Liste, Novel serileri bölümünden gelir."
      - {label: Bölüm numarası, name: numara, widget: number, value_type: int, min: 1, hint: "1, 2, 3 diye devam et. Aynı seride aynı numarayı iki kez kullanma. Kaydettikten sonra değiştirme."}
      - {label: Bölüm başlığı, name: baslik, widget: string, hint: "Sitede böyle görünür. Örnek: Bölüm 5: Yeni Başlangıç"}
      - {label: Bölüm metni, name: metin, widget: text, hint: "Yeni paragraf için araya boş bir satır bırak."}

  # ---------------------------------------------------------------- GÜNLÜK
  - name: gunluk
    label: Günlük
    icon: edit_note
    files:
      - name: yazilar
        label: Günlük yazıları
        file: veri/gunluk.json
        format: json
        fields:
          - label: Yazılar
            name: gunluk
            widget: list
            label_singular: yazı
            add_to_top: true
            summary: "{{fields.tarih}} {{fields.saat}} {{fields.baslik}}"
            fields:
              - {label: Tarih, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}"}
              - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false, hint: "İstersen boş bırak."}
              - {label: Başlık, name: baslik, widget: string}
              - {label: Yazı, name: metin, widget: text, hint: "Yeni paragraf için araya boş bir satır bırak."}

  # ---------------------------------------------------------------- TAKVİM
  - name: takvim
    label: Takvim
    icon: calendar_month
    files:
      - name: etkinlikler
        label: Takvim etkinlikleri
        file: veri/takvim.json
        format: json
        fields:
          - label: Etkinlikler
            name: takvim
            widget: list
            label_singular: etkinlik
            add_to_top: true
            summary: "{{fields.tarih}} {{fields.saat}} {{fields.baslik}}"
            fields:
              - {label: Tarih, name: tarih, widget: datetime, type: date, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}"}
              - {label: Saat, name: saat, widget: datetime, type: time, date_format: false, time_format: "HH:mm", required: false}
              - label: Tür
                name: tur
                widget: select
                default: yayin
                options: [{label: Canlı yayın, value: yayin}, {label: YouTube videosu, value: video}, {label: Diğer, value: diger}]
              - {label: Başlık, name: baslik, widget: string}
              - {label: Not, name: not, widget: text, required: false, hint: "İstersen kısa bir açıklama."}
